name: Clean Windows build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out Wildfires
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore pinned TFE 2.0.1 local dependency
        id: tfe-cache
        uses: actions/cache@v4
        with:
          path: .wildfires-cache/tfe-release/Wildfire_TerraFirmaEarth-1.20.1-forge-2.0.1.jar
          key: tfe-${{ runner.os }}-2.0.1-029ad1a7368b

      - name: Require authorized TFE release cache
        if: steps.tfe-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw 'The fixed-hash TFE 2.0.1 release is absent from the private dependency cache; refusing to build against old or unverified source.'

      - name: Build and verify pinned runtime
        run: .\gradlew.bat --no-daemon --console=plain build verifyTfeRuntime
