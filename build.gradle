buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

ext.tfeVersion = '1.1.3'
ext.tfeSourceCommit = '94d23b0312b5b98fc834b29b62ff6369ca3def9b'
ext.tfeSourceRepository = 'https://github.com/jc-cy/TerraFirmaEarth-1.20.1.git'
ext.tfeLocalJar = file("run/mods/Wildfire_TerraFirmaEarth-1.20.1-forge-${tfeVersion}.jar")

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.test
                }
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        name = "Local TerraFirmaEarth"
        dirs "run/mods"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    //curios
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    //create
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    //tfc
    implementation fg.deobf("curse.maven:terrafirmacraft-302973:7442504")
    // TerraFirmaEarth is a local-only development dependency. Use its named dev jar; production @Overwrite methods cannot be remapped safely by fg.deobf.
    compileOnly "local.tfe:Wildfire_TerraFirmaEarth-1.20.1-forge:${tfeVersion}"
    runtimeOnly "local.tfe:Wildfire_TerraFirmaEarth-1.20.1-forge:${tfeVersion}"

    //patchouli
    implementation fg.deobf("curse.maven:patchouli-306770:6164575")
    //jei
    implementation fg.deobf("curse.maven:jei-238222:7920915")
    //legendarysurvivaloverhaul
    implementation fg.deobf("curse.maven:legendary-survival-overhaul-840254:6286507")
    //jade
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    //kjs
    implementation fg.deobf("curse.maven:kubejs-238086:5853326")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")
    implementation fg.deobf("curse.maven:eventjs-1132802:7143082")
    //geckolib
    implementation fg.deobf("curse.maven:geckolib-388172:6789487")
    //spartan-weaponry
    implementation fg.deobf("curse.maven:spartan-weaponry-278141:5597663")
    //irons-spells
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6054196")
    runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6054196")
    runtimeOnly fg.deobf("maven.modrinth:caelus:3.2.0+1.20.1")
    runtimeOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    //kubejs-tfc
    implementation fg.deobf("curse.maven:kubejs-tfc-841001:6201323")
    //create-metallurgy
    implementation fg.deobf("curse.maven:create-metallurgy-1007404:6741785")
    //citadel
    implementation fg.deobf("curse.maven:citadel-331936:6702068")
    //alexs-caves
    implementation fg.deobf("curse.maven:alexs-caves-924854:5848216")
    //Aquaculture
    implementation fg.deobf("curse.maven:aquaculture-60028:7331172")
    //firmalife
    implementation fg.deobf("curse.maven:firmalife-453394:7602336")
    //farmers-delight
    implementation fg.deobf("curse.maven:farmers-delight-398521:8083474")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // Keep the license evidence next to the exact binary and resources it covers.
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('third_party')) {
        into 'third_party'
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

apply from: 'gradle/tfe-dev-bootstrap.gradle'

tasks.register('celestialMathSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic unified celestial mathematics, body and packet checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.celestial.CelestialMathSelfTest'
}

tasks.register('celestialClientSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic star-table and client celestial visual-rule checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.client.celestial.CelestialClientSelfTest'
}

tasks.register('calendarRateSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for TFC calendar-rate accumulation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.tfc.calendar.CalendarRateAccumulatorSelfTest'
}

tasks.register('spaceCoreSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for fixed-station route and journey state transitions.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceCoreSelfTest'
}

tasks.register('spacePersistenceSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for global station SavedData, region allocation, and recovery.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpacePersistenceSelfTest'
}

tasks.register('spaceObservationSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for orbit observation snapshots and packet ordering.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceObservationSelfTest'
}

tasks.register('spaceTravelSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for atomic station departure transactions and C2S intent.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceTravelSelfTest'
}

tasks.register('spaceVisualSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for NTM/Genesis orbit visuals, phase turns, and travel LOD.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.client.space.render.SpaceVisualSelfTest'
}

tasks.named('check').configure {
    dependsOn tasks.named('celestialMathSelfTest'), tasks.named('celestialClientSelfTest'),
            tasks.named('calendarRateSelfTest'), tasks.named('spaceCoreSelfTest'),
            tasks.named('spacePersistenceSelfTest'), tasks.named('spaceObservationSelfTest'),
            tasks.named('spaceTravelSelfTest'), tasks.named('spaceVisualSelfTest')
}
