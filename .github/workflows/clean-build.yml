name: Clean Windows build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out Wildfires
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache pinned TFE dev artifact
        uses: actions/cache@v4
        with:
          path: |
            .wildfires-cache
            run/mods/Wildfire_TerraFirmaEarth-1.20.1-forge-1.1.3.jar
            run/mods/.wildfires-tfe-dev.properties
          key: tfe-${{ runner.os }}-1.1.3-94d23b0312b5-${{ hashFiles('build.gradle', 'gradle/tfe-dev-bootstrap.gradle') }}

      - name: Build and verify pinned runtime
        run: .\gradlew.bat --no-daemon --console=plain build verifyTfeRuntime
